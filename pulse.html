<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>PULSE</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Monoton&family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --cyan:#27f5e6;
    --magenta:#ff2d95;
    --violet:#7b2cff;
    --gold:#ffd23f;
    --ink:#05030f;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;overflow:hidden;background:var(--ink);}
  body{
    font-family:'Chakra Petch',sans-serif;
    color:#eafcff;
    -webkit-tap-highlight-color:transparent;
    user-select:none;
    touch-action:none;
  }
  #stage{position:fixed;inset:0;}
  canvas{display:block;width:100%;height:100%;}

  /* ---- HUD ---- */
  #hud{
    position:fixed;top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    padding:18px 20px;pointer-events:none;z-index:5;
    font-weight:600;letter-spacing:.05em;
  }
  .hud-block{display:flex;flex-direction:column;gap:2px;}
  .hud-label{font-size:11px;letter-spacing:.28em;text-transform:uppercase;opacity:.5;}
  #score{font-size:30px;font-weight:700;color:#fff;text-shadow:0 0 14px rgba(39,245,230,.6);line-height:1;}
  #best{font-size:14px;opacity:.7;text-align:right;}
  #combo-wrap{align-items:flex-end;}
  #combo{
    font-size:26px;font-weight:700;line-height:1;
    color:var(--gold);text-shadow:0 0 16px rgba(255,210,63,.7);
    transition:transform .12s ease;
  }
  #combo.pop{transform:scale(1.35);}

  /* ---- Overlays ---- */
  .overlay{
    position:fixed;inset:0;z-index:10;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:24px;
    background:radial-gradient(120% 120% at 50% 30%, rgba(123,44,255,.18), rgba(5,3,15,.78) 60%, rgba(5,3,15,.94));
    backdrop-filter:blur(2px);
    transition:opacity .4s ease;
  }
  .overlay.hidden{opacity:0;pointer-events:none;}

  .title{
    font-family:'Monoton',cursive;
    font-size:clamp(58px,20vw,140px);
    line-height:.9;
    color:#fff;
    letter-spacing:.04em;
    text-shadow:
      0 0 8px #fff,
      0 0 22px var(--magenta),
      0 0 52px var(--magenta),
      0 0 90px var(--violet);
    animation:flicker 5s infinite;
  }
  @keyframes flicker{
    0%,18%,22%,25%,53%,57%,100%{opacity:1;}
    20%,24%,55%{opacity:.72;}
  }
  .tagline{
    margin-top:14px;font-size:13px;letter-spacing:.5em;text-transform:uppercase;
    color:var(--cyan);opacity:.85;text-shadow:0 0 12px rgba(39,245,230,.5);
    padding-left:.5em;
  }
  .howto{
    margin-top:30px;max-width:340px;font-size:14px;line-height:1.7;opacity:.75;
  }
  .howto b{color:var(--gold);font-weight:700;}
  .btn{
    margin-top:34px;
    font-family:'Chakra Petch',sans-serif;font-weight:700;
    font-size:18px;letter-spacing:.22em;text-transform:uppercase;
    color:var(--ink);background:var(--cyan);
    border:none;border-radius:40px;padding:16px 46px;cursor:pointer;
    box-shadow:0 0 24px rgba(39,245,230,.55),0 0 60px rgba(39,245,230,.25);
    transition:transform .15s ease, box-shadow .15s ease;
  }
  .btn:hover{transform:translateY(-2px) scale(1.03);box-shadow:0 0 34px rgba(39,245,230,.8),0 0 90px rgba(39,245,230,.4);}
  .btn:active{transform:scale(.97);}

  .go-title{
    font-family:'Monoton',cursive;font-size:clamp(40px,12vw,84px);
    color:#fff;letter-spacing:.03em;
    text-shadow:0 0 8px #fff,0 0 26px var(--magenta),0 0 64px var(--magenta);
  }
  .go-stats{margin-top:24px;display:flex;gap:46px;}
  .go-stat .v{font-size:42px;font-weight:700;color:#fff;line-height:1;text-shadow:0 0 16px rgba(39,245,230,.6);}
  .go-stat .k{font-size:11px;letter-spacing:.26em;text-transform:uppercase;opacity:.5;margin-top:6px;}
  .newbest{
    margin-top:20px;color:var(--gold);font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;font-size:14px;text-shadow:0 0 18px rgba(255,210,63,.7);
    animation:pulseGlow 1.1s infinite;
  }
  @keyframes pulseGlow{0%,100%{opacity:1;}50%{opacity:.45;}}
</style>
</head>
<body>
  <div id="stage"><canvas id="c"></canvas></div>

  <div id="hud">
    <div class="hud-block">
      <span class="hud-label">Score</span>
      <span id="score">0</span>
      <span id="best">Best 0</span>
    </div>
    <div class="hud-block" id="combo-wrap">
      <span class="hud-label">Multiplier</span>
      <span id="combo">x1.0</span>
    </div>
  </div>

  <div class="overlay" id="title-screen">
    <h1 class="title">PULSE</h1>
    <div class="tagline">dodge · collect · survive</div>
    <p class="howto">
      Glide your orb to weave through the neon hazards.<br/>
      Grab the <b>cyan sparks</b> to charge your multiplier.<br/>
      A clean near-miss adds bonus charge.
    </p>
    <button class="btn" id="start-btn">Start</button>
  </div>

  <div class="overlay hidden" id="over-screen">
    <h2 class="go-title">WIPEOUT</h2>
    <div class="go-stats">
      <div class="go-stat"><div class="v" id="final-score">0</div><div class="k">Score</div></div>
      <div class="go-stat"><div class="v" id="final-best">0</div><div class="k">Best</div></div>
    </div>
    <div class="newbest" id="newbest" style="display:none;">New Record!</div>
    <button class="btn" id="retry-btn">Retry</button>
  </div>

<script>
(function(){
  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let W = 0, H = 0, DPR = 1;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = stage.clientWidth; H = stage.clientHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- State ----------
  const STATE = { TITLE:0, PLAY:1, OVER:2 };
  let state = STATE.TITLE;

  const palette = ['#ff2d95','#ff5e3a','#b026ff','#ff206e'];

  const player = { x:0, y:0, tx:0, ty:0, r:14, hit:11, trail:[] };
  let hazards = [], sparks = [], particles = [];
  let score = 0, best = 0, mult = 1;
  let elapsed = 0, hazTimer = 0, sparkTimer = 0, shake = 0, overLock = 0;
  let pointerActive = false, usingTouch = false;
  const keys = {};

  function reset(){
    player.x = W/2; player.y = H*0.72; player.tx = player.x; player.ty = player.y;
    player.trail.length = 0;
    hazards = []; sparks = []; particles = [];
    score = 0; mult = 1; elapsed = 0; hazTimer = .6; sparkTimer = 1; shake = 0;
  }

  // ---------- Input ----------
  function setTarget(clientX, clientY, touch){
    const rect = canvas.getBoundingClientRect();
    let x = clientX - rect.left;
    let y = clientY - rect.top - (touch ? 52 : 0); // lead the finger so it isn't hidden
    player.tx = Math.max(player.r, Math.min(W - player.r, x));
    player.ty = Math.max(player.r, Math.min(H - player.r, y));
  }
  stage.addEventListener('pointerdown', e=>{
    usingTouch = e.pointerType === 'touch';
    pointerActive = true;
    setTarget(e.clientX, e.clientY, usingTouch);
  });
  stage.addEventListener('pointermove', e=>{
    if(!pointerActive && e.pointerType==='mouse'){ // mouse follows even without press
      setTarget(e.clientX, e.clientY, false); return;
    }
    if(pointerActive) setTarget(e.clientX, e.clientY, e.pointerType==='touch');
  });
  window.addEventListener('pointerup', ()=>{ pointerActive = false; });
  window.addEventListener('keydown', e=>{ keys[e.key.toLowerCase()] = true; });
  window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

  // ---------- Helpers ----------
  const rand = (a,b)=> a + Math.random()*(b-a);
  function burst(x,y,color,n,spd){
    for(let i=0;i<n;i++){
      const a = Math.random()*Math.PI*2, s = rand(spd*0.3, spd);
      particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:rand(1.5,3.5),color});
    }
  }

  function spawnHazard(){
    const diff = Math.min(elapsed/55, 1);          // 0 -> 1 over ~55s
    const r = rand(13, 26 + diff*14);
    const x = rand(r, W-r);
    const speed = rand(120,180) + diff*240 + score*0.02;
    const angVel = rand(-3,3);
    const sides = [3,4,6][Math.floor(Math.random()*3)];
    hazards.push({x, y:-r-10, r, vy:speed, vx:rand(-40,40), rot:Math.random()*6.28, angVel,
                  sides, color: palette[Math.floor(Math.random()*palette.length)], near:false, hitR:r*0.86});
  }
  function spawnSpark(){
    const r = 9;
    sparks.push({x:rand(r, W-r), y:-r-10, r, vy:rand(110,150), vx:rand(-30,30), rot:0, pulse:Math.random()*6.28});
  }

  // ---------- Update ----------
  function update(dt){
    elapsed += dt;
    // keyboard steering
    const ks = 520*dt;
    if(keys['arrowleft']||keys['a']) player.tx -= ks;
    if(keys['arrowright']||keys['d']) player.tx += ks;
    if(keys['arrowup']||keys['w']) player.ty -= ks;
    if(keys['arrowdown']||keys['s']) player.ty += ks;
    player.tx = Math.max(player.r, Math.min(W-player.r, player.tx));
    player.ty = Math.max(player.r, Math.min(H-player.r, player.ty));

    // smooth follow
    player.x += (player.tx - player.x) * Math.min(1, dt*16);
    player.y += (player.ty - player.y) * Math.min(1, dt*16);
    player.trail.push({x:player.x, y:player.y});
    if(player.trail.length > 14) player.trail.shift();

    // multiplier decay
    mult = Math.max(1, mult - dt*0.35);

    // survival score
    score += dt * 8 * mult;

    // spawn
    const diff = Math.min(elapsed/55, 1);
    hazTimer -= dt;
    if(hazTimer <= 0){ spawnHazard(); hazTimer = rand(0.55,0.95) - diff*0.42; }
    sparkTimer -= dt;
    if(sparkTimer <= 0){ spawnSpark(); sparkTimer = rand(1.3,2.4); }

    // hazards
    for(let i=hazards.length-1;i>=0;i--){
      const h = hazards[i];
      h.y += h.vy*dt; h.x += h.vx*dt; h.rot += h.angVel*dt;
      if(h.x < h.r || h.x > W-h.r) h.vx *= -1;
      const dx = h.x-player.x, dy = h.y-player.y;
      const dist = Math.hypot(dx,dy);
      // collision
      if(dist < h.hitR + player.hit){ die(); return; }
      // near miss
      if(!h.near && dist < h.hitR + player.hit + 26 && h.y > player.y - 8){
        h.near = true; mult = Math.min(9, mult + 0.35); score += 5*mult;
        burst(player.x, player.y, '#ffffff', 5, 120);
      }
      if(h.y - h.r > H + 20) hazards.splice(i,1);
    }
    // sparks
    for(let i=sparks.length-1;i>=0;i--){
      const s = sparks[i];
      s.y += s.vy*dt; s.x += s.vx*dt; s.pulse += dt*6;
      if(s.x<s.r||s.x>W-s.r) s.vx*=-1;
      const dist = Math.hypot(s.x-player.x, s.y-player.y);
      if(dist < s.r + player.r + 4){
        mult = Math.min(9, mult + 0.6);
        score += 25*mult;
        burst(s.x, s.y, '#27f5e6', 16, 240);
        popCombo();
        sparks.splice(i,1); continue;
      }
      if(s.y - s.r > H+20) sparks.splice(i,1);
    }
    // particles
    for(let i=particles.length-1;i>=0;i--){
      const p = particles[i];
      p.x+=p.vx*dt; p.y+=p.vy*dt; p.vx*=0.94; p.vy*=0.94; p.life -= dt*1.6;
      if(p.life<=0) particles.splice(i,1);
    }
    if(shake>0) shake = Math.max(0, shake - dt*60);
  }

  function die(){
    burst(player.x, player.y, '#ff2d95', 40, 360);
    burst(player.x, player.y, '#ffffff', 20, 240);
    shake = 22;
    state = STATE.OVER;
    overLock = 0.55;
    const final = Math.floor(score);
    const isBest = final > best;
    if(isBest) best = final;
    document.getElementById('final-score').textContent = final;
    document.getElementById('final-best').textContent = best;
    document.getElementById('newbest').style.display = isBest && final>0 ? 'block':'none';
    showOverlay('over-screen');
  }

  // ---------- Render ----------
  let gridOffset = 0;
  function drawBackground(dt){
    // gradient sky
    const g = ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#1a0838'); g.addColorStop(0.45,'#0a0420'); g.addColorStop(1,'#05030f');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);

    // synthwave sun
    const sunY = H*0.30, sunR = Math.min(W,H)*0.22;
    const sg = ctx.createLinearGradient(0, sunY-sunR, 0, sunY+sunR);
    sg.addColorStop(0,'#ffe14d'); sg.addColorStop(0.5,'#ff6ad5'); sg.addColorStop(1,'#b026ff');
    ctx.save();
    ctx.beginPath(); ctx.arc(W/2, sunY, sunR, 0, Math.PI*2); ctx.clip();
    ctx.fillStyle = sg; ctx.fillRect(W/2-sunR, sunY-sunR, sunR*2, sunR*2);
    // scanline bands across sun
    ctx.fillStyle = 'rgba(10,4,32,0.9)';
    for(let i=0;i<8;i++){ const yy = sunY + i*5 + i*i*1.4; ctx.fillRect(W/2-sunR, yy, sunR*2, 3+i*0.6); }
    ctx.restore();
    ctx.save();
    ctx.globalAlpha = 0.25; ctx.shadowBlur=60; ctx.shadowColor='#ff2d95';
    ctx.beginPath(); ctx.arc(W/2, sunY, sunR, 0, Math.PI*2); ctx.strokeStyle='#ff6ad5'; ctx.lineWidth=2; ctx.stroke();
    ctx.restore();

    // perspective floor grid
    gridOffset = (gridOffset + dt*120) % 60;
    const horizon = H*0.52;
    ctx.save();
    ctx.strokeStyle = 'rgba(123,44,255,0.30)'; ctx.lineWidth = 1;
    ctx.beginPath();
    for(let x=-W; x<=W*2; x+=Math.max(40, W/12)){
      ctx.moveTo(W/2, horizon); ctx.lineTo(x, H);
    }
    let y = horizon, step = 6;
    while(y < H){ ctx.moveTo(0,y); ctx.lineTo(W,y); y += step; step *= 1.32; }
    ctx.stroke();
    ctx.restore();
  }

  function polygon(x,y,r,sides,rot){
    ctx.beginPath();
    for(let i=0;i<sides;i++){
      const a = rot + i/sides*Math.PI*2;
      const px = x + Math.cos(a)*r, py = y + Math.sin(a)*r;
      i===0 ? ctx.moveTo(px,py) : ctx.lineTo(px,py);
    }
    ctx.closePath();
  }

  function render(dt){
    ctx.save();
    if(shake>0){ ctx.translate(rand(-shake,shake), rand(-shake,shake)); }
    drawBackground(dt);

    // sparks
    for(const s of sparks){
      const pr = s.r + Math.sin(s.pulse)*2;
      ctx.save(); ctx.shadowBlur=22; ctx.shadowColor='#27f5e6';
      ctx.fillStyle='#27f5e6'; ctx.beginPath(); ctx.arc(s.x,s.y,pr*0.55,0,6.28); ctx.fill();
      ctx.globalAlpha=0.5; ctx.beginPath(); ctx.arc(s.x,s.y,pr,0,6.28); ctx.strokeStyle='#bafff8'; ctx.lineWidth=2; ctx.stroke();
      ctx.restore();
    }

    // hazards
    for(const h of hazards){
      ctx.save(); ctx.shadowBlur=18; ctx.shadowColor=h.color;
      ctx.fillStyle = h.color; polygon(h.x,h.y,h.r,h.sides,h.rot); ctx.fill();
      ctx.globalAlpha=0.9; ctx.strokeStyle='#fff'; ctx.lineWidth=1.5;
      polygon(h.x,h.y,h.r*0.62,h.sides,-h.rot); ctx.stroke();
      ctx.restore();
    }

    // particles
    for(const p of particles){
      ctx.save(); ctx.globalAlpha=Math.max(0,p.life); ctx.shadowBlur=10; ctx.shadowColor=p.color;
      ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,6.28); ctx.fill(); ctx.restore();
    }

    // player trail
    if(state===STATE.PLAY){
      for(let i=0;i<player.trail.length;i++){
        const t=player.trail[i]; const a=i/player.trail.length;
        ctx.save(); ctx.globalAlpha=a*0.4; ctx.fillStyle='#27f5e6';
        ctx.beginPath(); ctx.arc(t.x,t.y,player.r*a*0.9,0,6.28); ctx.fill(); ctx.restore();
      }
      // player orb
      ctx.save(); ctx.shadowBlur=26; ctx.shadowColor='#27f5e6';
      const pg = ctx.createRadialGradient(player.x,player.y,1,player.x,player.y,player.r);
      pg.addColorStop(0,'#ffffff'); pg.addColorStop(0.5,'#7df9ef'); pg.addColorStop(1,'#27f5e6');
      ctx.fillStyle=pg; ctx.beginPath(); ctx.arc(player.x,player.y,player.r,0,6.28); ctx.fill();
      ctx.lineWidth=2; ctx.strokeStyle='rgba(255,255,255,0.8)'; ctx.stroke();
      ctx.restore();
    }
    ctx.restore();
  }

  // ---------- HUD ----------
  const elScore=document.getElementById('score'), elBest=document.getElementById('best'),
        elCombo=document.getElementById('combo');
  let comboPopT=0;
  function popCombo(){ elCombo.classList.add('pop'); comboPopT=0.12; }
  function updateHUD(dt){
    elScore.textContent = Math.floor(score);
    elBest.textContent = 'Best ' + best;
    elCombo.textContent = 'x'+mult.toFixed(1);
    if(comboPopT>0){ comboPopT-=dt; if(comboPopT<=0) elCombo.classList.remove('pop'); }
  }

  // ---------- Overlays ----------
  function showOverlay(id){ document.getElementById(id).classList.remove('hidden'); }
  function hideOverlay(id){ document.getElementById(id).classList.add('hidden'); }
  function startGame(){
    hideOverlay('title-screen'); hideOverlay('over-screen');
    reset(); state = STATE.PLAY;
  }
  document.getElementById('start-btn').addEventListener('click', startGame);
  document.getElementById('retry-btn').addEventListener('click', ()=>{ if(overLock<=0) startGame(); });

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now){
    let dt = (now - last)/1000; last = now;
    if(dt > 0.05) dt = 0.05; // clamp big gaps
    if(state===STATE.PLAY) update(dt);
    if(state===STATE.OVER && overLock>0) overLock -= dt;
    render(dt);
    updateHUD(dt);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
